# Build and cache the shared test image used by GitHub Actions and local CI.
name: Build shared CI image
description: Build the self-contained test image used by local Docker commands and GitHub CI.
inputs:
  target:
    description: Dockerfile stage, backend or ui.
    required: true
  python:
    description: Python version for the backend stage.
    default: '3.12'
  image:
    description: Local Docker image tag to load.
    required: true
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: deploy/ci/Dockerfile
        target: ${{ inputs.target }}
        build-args: PYTHON_VERSION=${{ inputs.python }}
        load: true
        push: false
        tags: ${{ inputs.image }}
        cache-from: type=gha,scope=ci-${{ inputs.target }}-${{ inputs.python }}
        cache-to: type=gha,mode=max,scope=ci-${{ inputs.target }}-${{ inputs.python }}
